<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis FC Punto Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A1628; --navy2:#0f2038; --navy3:#152a48; --line:rgba(201,168,76,.28);
  --gold:#C9A84C; --gold2:#e6c873; --white:#FCFDFD; --mute:#9fb0c8;
  --ok:#4fd1a5; --warn:#f2b84b; --bad:#ff6b6b; --cyan:#6fd3ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--navy);color:var(--white);font-family:Jost,system-ui,sans-serif}
body{min-height:100vh;background:
  radial-gradient(1200px 600px at 50% -10%,rgba(201,168,76,.10),transparent 60%),
  radial-gradient(900px 500px at 50% 110%,rgba(111,211,255,.06),transparent 60%),var(--navy)}
.mono{font-family:"JetBrains Mono",monospace}
.wrap{max-width:1180px;margin:0 auto;padding:16px}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px 16px;background:linear-gradient(180deg,rgba(21,42,72,.7),rgba(10,22,40,.7))}
.brand{display:flex;flex-direction:column}
.brand b{font-weight:700;letter-spacing:.32em;font-size:18px;color:var(--gold)}
.brand span{font-size:11px;letter-spacing:.22em;color:var(--mute);text-transform:uppercase}
.hright{text-align:right;font-size:11px;color:var(--mute)}
.badge{display:inline-block;margin-top:4px;padding:2px 8px;border:1px solid var(--warn);color:var(--warn);border-radius:20px;font-size:10px;letter-spacing:.12em}

/* core */
.core{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-top:16px}
@media(min-width:900px){.core{grid-template-columns:420px minmax(0,1fr)}}
.core>div{min-width:0}
html,body{overflow-x:hidden}
@media(max-width:600px){header{flex-wrap:wrap}.hright{text-align:left}.brand b{font-size:15px}}
.orbbox{border:1px solid var(--line);border-radius:14px;padding:10px;background:rgba(15,32,56,.55);position:relative}
svg#orb{width:100%;max-width:360px;height:auto;display:block;margin:0 auto}
.node{cursor:pointer}
.node circle.ring{fill:var(--navy2);stroke:var(--gold);stroke-width:1.5;transition:.25s}
.node.active circle.ring,.node:hover circle.ring{fill:rgba(201,168,76,.22);stroke:var(--gold2);stroke-width:2.5}
.node text{fill:var(--white);font-size:11px;font-family:Jost;letter-spacing:.08em;text-anchor:middle;font-weight:500}
.node .num{fill:var(--gold2);font-size:15px;font-weight:700}
.link{stroke:rgba(201,168,76,.35);stroke-width:1}
.link.active{stroke:var(--gold2);stroke-width:2}
@keyframes pulse{0%,100%{r:34;opacity:.9}50%{r:38;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{transform-origin:200px 200px;animation:spin 40s linear infinite}
.spin2{transform-origin:200px 200px;animation:spin 70s linear infinite reverse}
.speaking .corec{animation:pulse .5s ease-in-out infinite}

.voice{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
button{font-family:Jost;cursor:pointer;border-radius:10px;border:1px solid var(--gold);background:transparent;color:var(--gold);padding:9px 14px;font-size:13px;letter-spacing:.06em;font-weight:500}
button.primary{background:var(--gold);color:var(--navy);font-weight:700}
button:active{transform:scale(.98)}
.subs{min-height:44px;margin-top:10px;text-align:center;font-size:14px;color:var(--white);padding:0 8px}
.subs em{color:var(--gold2);font-style:normal}

/* overview strip */
.strip{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:600px){.strip{grid-template-columns:repeat(4,1fr)}}
.kpi{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:rgba(21,42,72,.5)}
.kpi .l{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.kpi .v{font-size:22px;font-weight:700;margin-top:2px}
.kpi .d{font-size:11px;margin-top:2px}
.up{color:var(--ok)} .down{color:var(--bad)} .flat{color:var(--mute)}
.agents{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.agent{border-radius:12px;padding:10px 12px;border:1px solid}
.agent.best{border-color:rgba(79,209,165,.5);background:rgba(79,209,165,.07)}
.agent.worst{border-color:rgba(255,107,107,.5);background:rgba(255,107,107,.07)}
.agent .l{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.agent .n{font-size:16px;font-weight:600;margin-top:2px}
.agent .s{font-size:11px;color:var(--mute)}

/* tabs + panels */
.tabs{display:flex;gap:6px;overflow-x:auto;margin-top:18px;padding-bottom:4px;scrollbar-width:none}
.tab{white-space:nowrap;border:1px solid var(--line);color:var(--mute);background:transparent;font-size:12px;padding:8px 12px}
.tab.on{border-color:var(--gold);color:var(--navy);background:var(--gold);font-weight:700}
.panel{display:none;margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:14px;background:rgba(15,32,56,.6)}
.panel.on{display:block;animation:fade .35s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:12px}
.ph h2{font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600}
.ph span{font-size:11px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
h3{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin:16px 0 8px;font-weight:500}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-weight:500;color:var(--mute);text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:6px 6px;border-bottom:1px solid var(--line)}
td{padding:8px 6px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:top}
td.r,th.r{text-align:right}
.tw{overflow-x:auto}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:600;white-space:nowrap}
.p-ok{background:rgba(79,209,165,.15);color:var(--ok)}
.p-10{background:rgba(242,184,75,.15);color:var(--warn)}
.p-15{background:rgba(255,150,80,.17);color:#ff9a55}
.p-20{background:rgba(255,107,107,.17);color:var(--bad)}
.p-new{background:rgba(111,211,255,.13);color:var(--cyan)}
.bar{height:6px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.funnel{display:flex;flex-direction:column;gap:6px}
.frow{display:grid;grid-template-columns:110px 1fr 40px;align-items:center;gap:8px;font-size:12px}
.frow .b{height:18px;border-radius:4px;background:linear-gradient(90deg,rgba(201,168,76,.85),rgba(201,168,76,.35))}
.note{font-size:11px;color:var(--mute);margin-top:10px}
.rules{display:grid;gap:6px;font-size:12px}
.views{display:flex;gap:4px;margin-top:6px;justify-content:flex-end;flex-wrap:wrap}.views button{padding:3px 8px;font-size:10px;border-color:var(--line);color:var(--mute)}.views button.on{background:var(--gold);color:var(--navy);border-color:var(--gold);font-weight:700}
@media(max-width:600px){.views{justify-content:flex-start}}

/* ===== movimento ===== */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1}
@keyframes breathe{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:.8;transform:scale(1.12)}}
.halo{transform-origin:200px 200px;animation:breathe 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.node{transform-box:fill-box;animation:bob 4s ease-in-out infinite}
@keyframes ringglow{0%,100%{stroke-opacity:.7}50%{stroke-opacity:1}}
.node circle.ring{animation:ringglow 2.6s ease-in-out infinite}
@keyframes grow{from{width:0}}
.bar i,.frow .b{animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes scan{0%{transform:translateY(-100%)}100%{transform:translateY(900%)}}
.orbbox{overflow:hidden}
.orbbox::after{content:"";position:absolute;left:0;right:0;top:0;height:12%;background:linear-gradient(180deg,transparent,rgba(201,168,76,.07),transparent);animation:scan 6s linear infinite;pointer-events:none}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.kpi,.panel{background-image:linear-gradient(110deg,transparent 40%,rgba(201,168,76,.06) 50%,transparent 60%);background-size:200% 100%;animation:shimmer 7s linear infinite}
@keyframes blink{50%{opacity:.35}}
.badge{animation:blink 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
footer{margin:22px 0 10px;text-align:center;font-size:10.5px;color:var(--mute);letter-spacing:.06em}
</style>
</head>

<script>
/* =========================================================
   DATI — in produzione arrivano dalle fonti collegate.
   Struttura pensata per essere riempita da Vendilo/Meta/Brevo/Supabase.
   ========================================================= */
const {V,D}=window.__JARVIS__;


/* =========================================================
   VISTE PER RUOLO — Store Manager: tutto. Team Manager: solo
   Listing, Buyer e Credito del proprio team. In produzione la
   vista la decide il login dell'Area Agenti, non un pulsante.
   ========================================================= */
const VIEWS={"store":{nome:"Store Manager"},"team-nigido":{nome:"Team Nigido",k:"N",share:.62},"team-esposito":{nome:"Team Esposito",k:"E",share:.38}};
let VIEW=(window.__JARVIS__.vista||""); if(!VIEWS[VIEW]) VIEW="store";
const TV=VIEW==="store"?null:VIEWS[VIEW];
if(TV){
  const sc=n=>Math.max(0,Math.round(n*TV.share));
  const L0=D.listing, B0=D.buyer, C0=D.credito;
  ["incarichiAttivi","pubblicati","nuoviSett","acquisizioniSett","acquisizioniObiettivo"].forEach(f=>L0[f]=sc(L0[f]));
  L0.professionisti={incontrati:sc(L0.professionisti.incontrati),contrattualizzati:sc(L0.professionisti.contrattualizzati)};
  L0.portali.forEach(p=>{p.richieste=sc(p.richieste);p.prev=sc(p.prev);});
  L0.immobili=L0.immobili.filter(x=>x.team===TV.k);
  ["openHouseOrganizzati","openHouseMese","appuntamenti","appuntamentiMutuo"].forEach(f=>B0[f]=sc(B0[f]));
  Object.keys(B0.proposte).forEach(f=>B0.proposte[f]=sc(B0.proposte[f]));
  ["consulenzeSett","consulenzeObiettivo","prequalifiche","pratiche","praticheObiettivo","erogatiMese","erogatoImporto","erogatiAnno"].forEach(f=>C0[f]=sc(C0[f]));
  C0.pipeline.forEach(p=>p.n=sc(p.n));
}

/* =========================================================
   REGOLE DI RIBASSO (dopo 21 giorni di pubblicazione)
   ========================================================= */
const SOGLIA_GIORNI = 21;
function regola(i){
  const contatti = i.imm + i.ide + i.sito + i.soc;
  if (i.giorni < SOGLIA_GIORNI) return {cls:"p-new", lab:"In osservazione", pct:0};
  if (i.proposte > 0) return {cls:"p-ok", lab:"Con proposta", pct:0};
  if (contatti === 0) return {cls:"p-20", lab:"Ribasso −20%", pct:20};
  if (i.visite === 0) return {cls:"p-15", lab:"Ribasso −15%", pct:15};
  return {cls:"p-10", lab:"Ribasso −10%", pct:10};
}

function pctWord(a,b){const p=Math.round((a-b)/b*100);return p>0?`in crescita del ${p} per cento`:p<0?`in calo del ${-p} per cento`:"stabili";}

/* orb svg */
const svg=document.getElementById("orb"), cx=200, cy=200, R=140;

<g class="spin"><circle cx="200" cy="200" r="175" fill="none" stroke="rgba(201,168,76,.18)" stroke-dasharray="2 8"/></g>
<g class="spin2"><circle cx="200" cy="200" r="105" fill="none" stroke="rgba(111,211,255,.18)" stroke-dasharray="14 10"/></g>`;

   s+=`<circle r="2.6" fill="#e6c873"><animateMotion dur="${dur}s" begin="${beg}s" repeatCount="indefinite" path="M${cx},${cy} L${P[k].x.toFixed(1)},${P[k].y.toFixed(1)}"/><animate attributeName="opacity" values="0;1;1;0" dur="${dur}s" begin="${beg}s" repeatCount="indefinite"/></circle>`;}
});

/* ===== numeri che salgono ===== */
function countUp(root){
  root.querySelectorAll(".kpi .v").forEach(el=>{
    const fin=el.dataset.fin||el.innerHTML; el.dataset.fin=fin;
    if(fin.includes("/")||!/\d/.test(fin)){return;}
    const m=fin.match(/\d[\d.]*(,\d+)?/); if(!m) return;
    const target=parseFloat(m[0].replace(/\./g,"").replace(",","."));
    const dec=(m[1]||"").length?m[1].length-1:0, t0=performance.now(), D=900;
    (function f(t){const p=Math.min(1,(t-t0)/D), e=1-Math.pow(1-p,3);
      const v=(target*e).toLocaleString("it-IT",{minimumFractionDigits:dec,maximumFractionDigits:dec});
      el.innerHTML=fin.replace(m[0],v); if(p<1) requestAnimationFrame(f); else el.innerHTML=fin;})(t0);
  });
}
countUp(document);
const _show=show; show=function(k){_show(k);const p=document.getElementById("p-"+k);if(p){p.querySelectorAll(".bar i,.frow .b").forEach(b=>{b.style.animation="none";b.offsetWidth;b.style.animation="";});countUp(p);}};

/* ===== particelle di sfondo ===== */
(function(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c=document.getElementById("bg"), x=c.getContext("2d"); let W,H,pts=[];
  function rs(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;c.style.width=innerWidth+"px";c.style.height=innerHeight+"px";
    const n=Math.round(Math.min(90,innerWidth/14));pts=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.25*devicePixelRatio,vy:(Math.random()-.5)*.25*devicePixelRatio,r:(Math.random()*1.4+.4)*devicePixelRatio}));}
  rs(); addEventListener("resize",rs);
  const L=120*devicePixelRatio;
  (function loop(){x.clearRect(0,0,W,H);
    for(const p of pts){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
      x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fillStyle="rgba(201,168,76,.55)";x.fill();}
    for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const a=pts[i],b=pts[j],d=Math.hypot(a.x-b.x,a.y-b.y);
      if(d<L){x.strokeStyle=`rgba(201,168,76,${(1-d/L)*.12})`;x.lineWidth=devicePixelRatio*.6;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();}}
    requestAnimationFrame(loop);})();
})();

/* voce */
const subs=document.getElementById("subs"), box=document.getElementById("orbbox");
let queue=[], keys=[], voiceIt=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();voiceIt=v.find(x=>/it-IT/i.test(x.lang)&&/Luca|Diego|male|Google/i.test(x.name))||v.find(x=>/^it/i.test(x.lang))||null;}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}
function speak(texts,ks){
  stop(); queue=texts.slice(); keys=ks.slice(); next();
}
function next(){
  if(!queue.length){box.classList.remove("speaking");return;}
  const t=queue.shift(), k=keys.shift(); if(k) show(k);
  subs.innerHTML=t;
  try{
    const u=new SpeechSynthesisUtterance(t.replace(/<[^>]+>/g,""));u.lang="it-IT";if(voiceIt)u.voice=voiceIt;u.rate=1.02;
    u.onend=next;u.onerror=()=>{box.classList.remove("speaking")};
    box.classList.add("speaking");speechSynthesis.speak(u);
  }catch(e){box.classList.remove("speaking");setTimeout(next,4000);}
}
function stop(){queue=[];keys=[];try{speechSynthesis.cancel()}catch(e){}box.classList.remove("speaking");}
document.getElementById("btnStop").onclick=()=>{stop();subs.textContent="Riepilogo interrotto.";};
document.getElementById("btnAll").onclick=()=>{
  const intro=TV?`Ecco il riepilogo del ${TV.nome}. Settimana ${D.settimana}.`:`Ecco il riepilogo, Nico. Settimana ${D.settimana}.`;
  const outro=TV?"Fine del riepilogo.":`Primo nella gara fatturato: ${BEST[0]}. Ultimo: ${WORST[0]}. Fine del riepilogo.`;
  speak([intro,...ORDER.map(k=>P[k].voce),outro],[null,...ORDER,null]);
};
